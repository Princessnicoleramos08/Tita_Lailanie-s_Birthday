<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lailanie’s Gallery 🎀</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', cursive;
  background: linear-gradient(to bottom, #ffd6ec, #ffeaf6);
  text-align: center;
}

h1 {
  margin-top: 20px;
  color: #ff4fa3;
  font-size: 40px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.gallery img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 15px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 18px rgba(255, 79, 163, 0.4);
}

.lightbox {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.lightbox img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 20px;
  box-shadow: 0 0 20px #fff;
}

.close, .prev, .next {
  position: absolute;
  top: 50%;
  color: white;
  font-size: 40px;
  cursor: pointer;
  user-select: none;
  transform: translateY(-50%);
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border-radius: 50%;
}

.close {
  top: 20px;
  right: 30px;
  font-size: 35px;
  transform: none;
}

.prev { left: 30px; }
.next { right: 30px; }

.caption {
  color: white;
  margin-top: 10px;
  font-size: 18px;
}

.nav {
  text-align: center;
  margin-top: 10px;
}

.nav a {
  text-decoration: none;
  margin: 4px;
  color: white;
  background: #ff4fa3;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  display: inline-block;
}
</style>
</head>

<body>

<h1>🎀 Lailanie’s Gallery 🎀</h1>

<!-- NAVIGATION BAR -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="Game.html">Game</a>
  <a href="Gallery.html">Gallery</a>
  <a href="Message.html">Message</a>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <span class="prev" onclick="changeImage(-1)">&#10094;</span>
  <img id="lightbox-img">
  <span class="next" onclick="changeImage(1)">&#10095;</span>
  <div class="caption" id="caption"></div>
</div>

<script>
const gallery = document.getElementById("gallery");
const totalImages = 79;
let currentIndex = 0;

// Load images dynamically
for (let i = 1; i <= totalImages; i++) {
  const img = document.createElement("img");
  img.src = `1 (${i}).jpg`;
  img.alt = `Photo ${i}`;
  img.onclick = function() {
    openLightbox(i - 1);
  };
  gallery.appendChild(img);
}

function openLightbox(index) {
  currentIndex = index;
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = `1 (${currentIndex + 1}).jpg`;
  document.getElementById("caption").innerText =
    `Lailanie slaying 💅 (Photo ${currentIndex + 1})`;
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function changeImage(n) {
  currentIndex += n;
  if (currentIndex < 0) currentIndex = totalImages - 1;
  if (currentIndex >= totalImages) currentIndex = 0;

  document.getElementById("lightbox-img").src =
    `1 (${currentIndex + 1}).jpg`;
  document.getElementById("caption").innerText =
    `Lailanie slaying 💅 (Photo ${currentIndex + 1})`;
}
</script>

</body>
</html>
